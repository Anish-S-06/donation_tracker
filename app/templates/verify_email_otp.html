{% extends 'base.html' %}
{% block title %}Verify Email - Seva Sankalp{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-5 col-lg-4">
        <div class="card border p-4 shadow-sm">
            <div class="card-body text-center p-2">
                
                <div class="mb-4">
                    <div class="d-inline-flex justify-content-center align-items-center rounded-circle bg-soft-primary text-primary" style="width: 64px; height: 64px; font-size: 1.8rem;">
                        ✉️
                    </div>
                </div>

                <h3 class="card-title mb-2 fw-bold text-dark">Check Your Email</h3>
                <p class="text-muted small mb-4">We've sent a 6-digit One Time Password (OTP) to your email address to verify your account.</p>
                
                <form action="{{ url_for('auth_routes.verify_email_otp') }}" method="POST">
                    
                    <div class="mb-4 text-start">
                        <label class="form-label fw-medium small text-muted text-center d-block">Enter 6-Digit OTP Code</label>
                        <input type="text" name="otp" class="form-control form-control-lg text-center font-monospace fw-bold" placeholder="123456" required maxlength="6" autofocus style="letter-spacing: 4px;">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Verify Account</button>
                </form>

                <hr class="my-4 border-subtle">
                
                <div class="d-flex flex-column align-items-center">
                    <p class="text-muted small mb-1">Didn't receive the code?</p>
                    <form method="POST" action="{{ url_for('auth_routes.resend_otp') }}">
                        <button type="submit" class="btn btn-link text-primary text-decoration-none fw-semibold small p-0">Resend Code</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
